<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medidor de Clima Pedreira</title>
  <style>
    /* Dá espaçamento e margem para os gráficos não ficarem colados */
iframe {
  margin: 15px;
  border-radius: 8px;
}

/* Dá espaço entre os blocos da página */
.container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #e8f4ff 0%, #d4ebff 100%);
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 780px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 10px 28px rgba(0, 55, 110, 0.08);
      text-align: center;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.02em;
    }

    .autor {
      margin-top: 6px;
      font-size: 0.98rem;
      font-weight: 500;
      color: #000000;
      opacity: 0.85;
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.15);
      font-size: 0.88rem;
      color: #000000;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #000000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-value {
      margin-top: 12px;
      font-size: 2.1rem;
      font-weight: 700;
      color: #000000;
    }

    .card-sub {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #000000;
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #000000;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/1?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/2?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/3?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <main class="container">
    <header>
      <h1>Medidor de Clima Pedreira</h1>
      <p class="autor">Criado por Daniel</p>
      <div class="status-bar">
        <span class="dot"></span>
        <span id="atualizacao">Aguardando leitura dos sensores...</span>
      </div>
    </header>

    <section class="grid">
      <article class="card">
        <div class="card-label">Luz (LDR)</div>
        <div class="card-value" id="valor-luz">--</div>
        <div class="card-sub" id="status-luz">Sem leitura</div>
      </article>

      <article class="card">
        <div class="card-label">Chuva</div>
        <div class="card-value" id="valor-chuva">--</div>
        <div class="card-sub" id="status-chuva">Sem leitura</div>
      </article>

      <article class="card">
        <div class="card-label">Gás (MQ-135)</div>
        <div class="card-value" id="valor-gas">--</div>
        <div class="card-sub" id="status-gas">Sem leitura</div>
      </article>
    </section>

    <footer>
      Monitoramento ambiental • Pedreira - SP
    </footer>
  </main>


   <script>
async function buscarDados() {
    try {
        // 1. URL da API do ThingSpeak para buscar a última leitura registrada
        const url = "https://api.thingspeak.com/channels/3578582/feeds/last.json?api_key=QJ89U0PM4PB95D1L";
        const resposta = await fetch(url);

        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }

        const dados = await resposta.json();

        // 2. Extrai os dados dos sensores (field1 = Luz, field2 = Chuva, field3 = Gás)
        const luz = (dados && dados.field1 !== null && dados.field1 !== undefined) ? dados.field1 : "--";
        const chuva = (dados && dados.field2 !== null && dados.field2 !== undefined) ? dados.field2 : "--";
        const gas = (dados && dados.field3 !== null && dados.field3 !== undefined) ? dados.field3 : "--";

        // 3. Atualiza os números principais nos cards
        const elLuz = document.getElementById("valor-luz");
        const elChuva = document.getElementById("valor-chuva");
        const elGas = document.getElementById("valor-gas");

        if (elLuz) elLuz.textContent = luz;
        if (elChuva) elChuva.textContent = chuva;
        if (elGas) elGas.textContent = gas;

        // 4. Atualiza os sub-status abaixo de cada valor nos cards
        const stLuz = document.getElementById("status-luz");
        const stChuva = document.getElementById("status-chuva");
        const stGas = document.getElementById("status-gas");

        if (stLuz) stLuz.textContent = luz !== "--" ? "Leitura ativa" : "Sem leitura";
        if (stChuva) stChuva.textContent = chuva !== "--" ? (parseFloat(chuva) > 0 ? "Chuva detectada" : "Sem chuva") : "Sem leitura";
        if (stGas) stGas.textContent = gas !== "--" ? `${gas} PPM` : "Sem leitura";

        // 5. Atualiza o texto de horário da última leitura na barra de status superior
        const elAtualizacao = document.getElementById("atualizacao");
        if (elAtualizacao) {
            const horario = new Date().toLocaleTimeString('pt-BR');
            elAtualizacao.textContent = `Última atualização: ${horario}`;
        }

    } catch (erro) {
        console.error("Erro ao carregar dados do ThingSpeak:", erro);
        const elAtualizacao = document.getElementById("atualizacao");
        if (elAtualizacao) {
            elAtualizacao.textContent = "Erro de conexão com o ThingSpeak";
        }
    }
}

// Executa assim que o HTML for carregado e repete a cada 15 segundos
document.addEventListener("DOMContentLoaded", () => {
    buscarDados();
    setInterval(buscarDados, 15000);
});
</script>
</body>
</html>
