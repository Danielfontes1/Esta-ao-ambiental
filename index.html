<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medidor de Clima Pedreira</title>
  <style>
    /* Dá espaçamento e margem para os gráficos não ficarem colados */
iframe {
  margin: 15px;
  border-radius: 8px;
}

/* Dá espaço entre os blocos da página */
.container {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, #e8f4ff 0%, #d4ebff 100%);
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 780px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 10px 28px rgba(0, 55, 110, 0.08);
      text-align: center;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.02em;
    }

    .autor {
      margin-top: 6px;
      font-size: 0.98rem;
      font-weight: 500;
      color: #000000;
      opacity: 0.85;
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.15);
      font-size: 0.88rem;
      color: #000000;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #000000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 14px;
      padding: 20px 16px;
      text-align: center;
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: #000000;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-value {
      margin-top: 12px;
      font-size: 2.1rem;
      font-weight: 700;
      color: #000000;
    }

    .card-sub {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #000000;
    }

    footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #000000;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/1?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/2?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/3?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/4?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <iframe width="450" height="260" style="border: 1px solid #cccccc;" src="https://thingspeak.com/channels/3578582/charts/5?bgcolor=%23ffffff&color=%23d62020&dynamic=true&results=60&type=line&update=15"></iframe>
  <main class="container">
    <header>
      <h1>Medidor de Clima Pedreira</h1>
      <p class="autor">Criado por Daniel</p>
      <div class="status-bar">
        <span class="dot"></span>
        <span id="atualizacao">Aguardando leitura dos sensores...</span>
      </div>
    </header>

    <section class="grid">
      <article class="card">
        <div class="card-label">Luz (LDR)</div>
        <div class="card-value" id="valor-luz">--</div>
        <div class="card-sub" id="status-luz">Sem leitura</div>
      
      </article>
      <article class="card">
        <div class="card-label">Temperatura 🌡️</div>
        <div class="card-value" id="valor-temp">--</div>
        <div class="card-sub" id="status-temp">-- °C</div>
      </article>

      <article class="card">
        <div class="card-label">Umidade 💧</div>
        <div class="card-value" id="valor-umid">--</div>
        <div class="card-sub" id="status-umid">-- %</div>
      </article>

        <article class="card">
          <div class="card-label">Chuva</div>
          <div class="card-value" id="valor-chuva">--</div>
          <div class="card-sub" id="status-chuva">Sem leitura</div>
        </article>

      <article class="card">
        <div class="card-label">Gás (MQ-135)</div>
        <div class="card-value" id="valor-gas">--</div>
        <div class="card-sub" id="status-gas">Sem leitura</div>
      </article>
    </section>

    <footer>
      Monitoramento ambiental • Pedreira - SP
    </footer>
  </main>


   <script>
  const CHANNEL_ID = "3578582";
  const API_KEY = "QJ89U0PM4PB95D1L";
  const INTERVALO_MS = 15000;

  function definirTexto(id, texto) {
    const elemento = document.getElementById(id);
    if (elemento) {
      elemento.textContent = texto;
    }
  }

  function formatarStatusTemp(valorBruto) {
    const t = parseFloat(valorBruto);
    if (Number.isNaN(t)) return "-- °C";
    if (t >= 30) return `${valorBruto} °C (Calor)`;
    if (t <= 18) return `${valorBruto} °C (Frio)`;
    return `${valorBruto} °C (Agradável)`;
  }

  function formatarStatusUmid(valorBruto) {
    const u = parseFloat(valorBruto);
    if (Number.isNaN(u)) return "-- %";
    if (u >= 70) return `${valorBruto} % (Umidade Alta)`;
    if (u <= 30) return `${valorBruto} % (Ar Seco)`;
    return `${valorBruto} % (Umidade Normal)`;
  }

  async function buscarDados() {
    try {
      const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json?api_key=${API_KEY}`;
      const resposta = await fetch(url);

      if (!resposta.ok) {
        throw new Error(`Erro HTTP: ${resposta.status}`);
      }

      const dados = await resposta.json();

      // 1. Extrai os 5 campos do ThingSpeak
      const luz = dados?.field1 ?? "--";
      const chuva = dados?.field2 ?? "--";
      const gas = dados?.field3 ?? "--";
      const temp = dados?.field4 ?? "--";
      const umid = dados?.field5 ?? "--";

      // 2. Atualiza os números principais nos cartões
      definirTexto("valor-luz", luz);
      definirTexto("valor-chuva", chuva);
      definirTexto("valor-gas", gas);
      definirTexto("valor-temp", temp);
      definirTexto("valor-umid", umid);

      // 3. Atualiza as legendas de status de temperatura e umidade
      definirTexto("status-temp", formatarStatusTemp(temp));
      definirTexto("status-umid", formatarStatusUmid(umid));
    } catch (erro) {
      console.error("Erro ao carregar dados do ThingSpeak:", erro);
    }
  }

  // Executa imediatamente ao abrir e repete a cada 15 segundos
  buscarDados();
  setInterval(buscarDados, INTERVALO_MS);
</script>
</body>
</html>
